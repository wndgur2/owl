<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기기 상태 (다크)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #141218; color: #E6E0E9; font-family: system-ui, sans-serif; overflow: hidden; box-sizing: border-box">

  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 16px; box-sizing: border-box">
    <h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 400">기기</h1>
    <a href="SettingsDark.dc.html" aria-label="설정" style="width: 48px; height: 48px; border-radius: 999px; color: #CAC4D0; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"></path><circle cx="16" cy="6" r="2.5"></circle><circle cx="10" cy="12" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle></svg>
    </a>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 0 16px 12px">

    <section aria-label="목걸이" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 12px 12px; background: #211F26; border-radius: 12px">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; background: #4F378B; color: #EADDFF; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2c0 2.8 2.2 5 5 5s5-2.2 5-5"></path><circle cx="12" cy="14" r="6"></circle><circle cx="12" cy="14" r="1.6" fill="currentColor"></circle></svg>
        </span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; text-align: center">
          <button type="button" aria-haspopup="listbox" aria-expanded="{{expanded}}" onClick="{{toggleMenu}}" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 2px; margin: 0 0 0 -8px; padding: 0 4px 0 8px; border: 0; border-radius: 8px; background: {{nameBg}}; color: #E6E0E9; font: inherit; font-size: 18px; line-height: 24px; font-weight: 500; letter-spacing: 0.1px; justify-content: flex-end; flex-direction: row">
            Owl-3F2A
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{chevron}}"></path></svg>
          </button>
        </span>
        <span style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; color: {{statusColor}}">
          <span style="width: 8px; height: 8px; border-radius: 999px; background: {{statusDot}}"></span>
          {{statusLabel}}
        </span>
      </div>
      <sc-if value="{{notAlive}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; padding: 0 0 4px 52px; font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: #CAC4D0">13:02 이후 목걸이 응답이 없어요. 녹음은 목걸이에 계속 쌓여요.</p>
      </sc-if>
      <sc-if value="{{isPaused}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; padding: 0 0 4px 52px; font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: #CAC4D0">목걸이 버튼을 길게 누르면 다시 녹음해요.</p>
      </sc-if>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <section aria-label="배터리" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #1D1B20; border-radius: 12px">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; color: #CAC4D0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"></rect><path d="M22 11v2"></path></svg>
          배터리
        </span>
        <span style="font-size: 32px; line-height: 40px">68%</span>
        <span style="display: flex; gap: 3px; height: 6px">
          <span style="width: 68%; background: #D0BCFF; border-radius: 3px"></span>
          <span style="flex-grow: 1; background: #4A4458; border-radius: 3px"></span>
        </span>
        <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: #CAC4D0">약 26시간 남음</span>
      </section>
      <section aria-label="저장 공간" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #1D1B20; border-radius: 12px">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; color: #CAC4D0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>
          저장 공간
        </span>
        <span style="display: flex; align-items: baseline; gap: 4px">
          <span style="font-size: 32px; line-height: 40px">2.1</span>
          <span style="font-size: 16px; line-height: 24px; letter-spacing: 0.15px; color: #CAC4D0">/ 16 MB</span>
        </span>
        <span style="display: flex; gap: 3px; height: 6px">
          <span style="width: 13%; background: #D0BCFF; border-radius: 3px"></span>
          <span style="flex-grow: 1; background: #4A4458; border-radius: 3px"></span>
        </span>
      </section>
    </div>

    <section aria-labelledby="sync-h" style="display: flex; flex-direction: column; background: #1D1B20; border-radius: 12px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px 16px">
        <h2 id="sync-h" style="margin: 0; flex-grow: 1; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; color: #D0BCFF">동기화</h2>
        <button type="button" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 12px; border: 0; border-radius: 999px; background: #4A4458; color: #E8DEF8; font: inherit; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"></path><path d="M18 3v4h-4M6 21v-4h4"></path></svg>
          지금 동기화
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 8px 16px; min-height: 56px; box-sizing: border-box">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span style="flex-grow: 1; font-size: 16px; line-height: 24px; letter-spacing: 0.5px">마지막 동기화</span>
        <span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: #CAC4D0">오늘 13:02</span>
      </div>
      <div style="height: 1px; margin: 0 16px; background: #49454F"></div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 8px 16px; min-height: 72px; box-sizing: border-box">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 16px; line-height: 24px; letter-spacing: 0.5px">아직 안 받은 녹음</span>
          <span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: #CAC4D0">목걸이에만 있어요. 다음 동기화 때 가져와요</span>
        </span>
        <span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: #CAC4D0">4개</span>
      </div>
    </section>

    <section aria-label="기기 정보" style="display: flex; flex-direction: column; background: #1D1B20; border-radius: 12px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 16px; padding: 8px 16px; min-height: 56px; box-sizing: border-box">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path></svg>
        <span style="flex-grow: 1; font-size: 16px; line-height: 24px; letter-spacing: 0.5px">펌웨어</span>
        <span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: #CAC4D0">0.1.0</span>
      </div>
    </section>

  </main>

  <nav aria-label="주 메뉴" style="height: 80px; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 0 16px; box-sizing: border-box; background: #211F26">
    <a href="MainDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #CAC4D0">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle><circle cx="5" cy="18" r="1.5"></circle><path d="M10 6h10M10 12h10M10 18h7"></path></svg>
      </span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px">타임라인</span>
    </a>
    <a href="SearchDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #CAC4D0">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px">검색</span>
    </a>
    <a href="DeviceDark.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #E6E0E9">
      <span style="width: 64px; height: 32px; border-radius: 16px; background: #4A4458; color: #E8DEF8; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2c0 2.8 2.2 5 5 5s5-2.2 5-5"></path><circle cx="12" cy="14" r="6"></circle><circle cx="12" cy="14" r="1.6" fill="currentColor"></circle></svg>
      </span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.5px">기기</span>
    </a>
  </nav>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="기기 목록 닫기" onClick="{{closeMenu}}" style="position: absolute; inset: 0; padding: 0; border: 0; background: transparent; cursor: default"></button>
    <div role="listbox" aria-label="기기 선택" style="position: absolute; top: 122px; left: 80px; width: 270px; padding: 8px 0; background: #211F26; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15); display: flex; flex-direction: column">
      <div role="option" aria-selected="true" tabindex="0" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px 8px 16px; background: rgba(208, 188, 255, 0.08)">
        <span style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px">Owl-3F2A</span>
          <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: #CAC4D0">지금 쓰는 목걸이</span>
        </span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D0BCFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
      </div>
      <div role="option" aria-selected="false" tabindex="0" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px 8px 16px">
        <span style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px">Owl-91C0</span>
          <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: #CAC4D0">마지막 연결 10월 20일</span>
        </span>
      </div>
      <div style="height: 1px; margin: 8px 0; background: #49454F"></div>
      <a href="OnboardingDark.dc.html" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px 0 12px; color: #D0BCFF; text-decoration: none">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <span style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px">새로운 기기</span>
      </a>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"alive":{"editor":"boolean","default":true},"recording":{"editor":"enum","options":["recording","paused"],"default":"recording"},"deviceMenuOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var alive = !!(this.props.alive ?? true);
    var rec = (this.props.recording ?? 'recording') === 'recording';
    var open = typeof st.devMenu === 'boolean' ? st.devMenu : !!(this.props.deviceMenuOpen ?? false);
    return {
      alive: alive,
      notAlive: !alive,
      isPaused: alive && !rec,
      statusLabel: !alive ? '응답 없음' : (rec ? '녹음 중' : '일시정지됨'),
      statusDot: !alive ? '#F2B8B5' : (rec ? '#D0BCFF' : '#EFB8C8'),
      statusColor: !alive ? '#F2B8B5' : '#CAC4D0',
      menuOpen: open,
      expanded: open ? 'true' : 'false',
      nameBg: open ? 'rgba(230, 224, 233, 0.08)' : 'transparent',
      chevron: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
      toggleMenu: function () { self.setState({ devMenu: !open }); },
      closeMenu: function () { self.setState({ devMenu: false }); }
    };
  }
}
</script>
</body>
</html>
