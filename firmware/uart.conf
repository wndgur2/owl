# Debug overlay: logs over the USB serial port (SAMD11 bridge -> uart20).
# Use only while the board is on USB.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_OWL_LOG_LEVEL_INF=y
# Prints each thread's peak stack use every 60 s (watch "audio": Opus uses VLAs).
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=60
CONFIG_THREAD_NAME=y
