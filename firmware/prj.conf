# Base config = "battery build".
# UART is off on purpose: Seeed's wiki reports the XIAO nRF54L15 may fail to boot
# from battery alone when UART is enabled. For USB debugging, add uart.conf:
#   west build ... -- -DEXTRA_CONF_FILE=uart.conf

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# --- peripherals
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_REGULATOR=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# --- power: idle peripherals suspend themselves (external flash deep power-down)
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWEROFF=y

# --- storage (decisions #18)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FLASH_MAP=y
CONFIG_FS_LITTLEFS_FMP_DEV=y
# segment, event and FETCH reader files + state file
CONFIG_FS_LITTLEFS_NUM_FILES=6
CONFIG_FS_LITTLEFS_NUM_DIRS=2

# --- Bluetooth peripheral (protocol §2)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Owl"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=12
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
# MTU 247 + Data Length Extension 251 + 2M PHY
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_GATT_CLIENT=y
# Ask for a 15-30 ms interval while connected (transfers are short bursts)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# --- kernel
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_RING_BUFFER=y
CONFIG_HWINFO=y
