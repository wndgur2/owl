# Base config = "battery build".
# UART is off on purpose: Seeed's wiki reports the XIAO nRF54L15 may fail to boot
# from battery alone when UART is enabled. For USB debugging, add uart.conf:
#   west build ... -- -DEXTRA_CONF_FILE=uart.conf

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# Peripherals used by the M0 bring-up test
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_REGULATOR=y

CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_FLASH_JESD216_API=y

CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Power management (external flash deep power-down, peripheral suspend)
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

CONFIG_MAIN_STACK_SIZE=4096
