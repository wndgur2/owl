name: 하드웨어 확인
description: 실제 보드·부품으로만 확인할 수 있는 작업 (CI로는 못 하는 것)
title: "[HW] "
labels: ["hardware"]
body:
  - type: textarea
    id: what
    attributes:
      label: 확인할 것
      description: "예: JEDEC ID가 ef 40 18로 읽히는지, 배터리만으로 부팅되는지"
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: 관련 PRD ID / 마일스톤 / decisions.md 항목
      placeholder: "예: D10 / M0 / #9"
  - type: checkboxes
    id: setup
    attributes:
      label: 필요한 하드웨어
      options:
        - label: XIAO nRF54L15 Sense 보드
        - label: 외장 SPI 플래시
        - label: LiPo 배터리
        - label: Android 폰
        - label: 전류 측정 장비
  - type: textarea
    id: steps
    attributes:
      label: 절차
      description: 빌드 명령(uart.conf 여부 포함), 굽기, 무엇을 보면 되는지
      placeholder: |
        west build -p -b xiao_nrf54l15/nrf54l15/cpuapp firmware -- -DEXTRA_CONF_FILE=uart.conf
        west flash
  - type: textarea
    id: result
    attributes:
      label: 결과
      description: 확인한 뒤 채워요. 측정값, 로그, 사진
