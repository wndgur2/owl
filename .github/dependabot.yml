# Weekly dependency update PRs, one grouped PR per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
