<text x="40" y="938" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 플래시는 다리를 위로 뒤집어(dead-bug) 붙여서, 위에서 보면 데이터시트 그림과 좌우가 바뀌어요. 1번 점은 뒤집으면 가려지니 먼저 1번 다리 쪽에 표시해요.</text>
<text x="40" y="962" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 플래시 방향은 3D 모델과 같아요: 보드 쪽 줄이 8 VCC · 7 /HOLD · 6 CLK · 5 DI, 바깥 줄이 1 /CS · 2 DO · 3 /WP · 4 GND.</text>
<text x="40" y="986" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 3V3은 8 VCC로 바로 가요. 7 /HOLD는 옆 다리 8에서, 3 /WP는 칩 등 위로 7에서 점퍼해요. /WP·/HOLD를 3V3에 묶어야 쓰기 보호와 일시 정지가 꺼져요.</text>
<text x="40" y="1010" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 소프트 터치 버튼은 양옆 탭 2개가 스위치 양쪽이에요. 누를 때만 이어지고 방향은 상관없어요. 택트 스위치(다리 4개)면 대각선 두 다리를 써요.</text>
<text x="40" y="1034" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 버튼 GND는 GND 선에서 갈라져요. GND 아무 데나 이어도 같고, 3D 모델에서는 플래시 4번 다리에서 짧게 점퍼해요.</text>
<text x="40" y="1058" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· D1은 펌웨어가 내부 풀업을 켜서, 버튼을 누르면 GND로 내려가 0이 돼요(active low). 배터리 극성은 납땜 전에 멀티미터로 확인!</text>
</svg>
