<circle cx="297" cy="900" r="4.2" fill="#c0c4ca" stroke="#555"/>
<text x="324" y="904" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1d1d" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >납땜</text>
