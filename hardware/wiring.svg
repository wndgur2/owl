<path d="M537,888 L537,893 A7,7 0 0 1 537,907 L537,912" fill="none" stroke="#1f6fd1" stroke-width="3.2"/>
<text x="564" y="904" font-size="13" text-anchor="start" font-weight="normal" fill="#1d1d1d" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >건너감 (안 이어짐)</text>
<text x="40" y="938" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 플래시는 칩이 납땜된 브레이크아웃 보드예요. 글자 면을 위로 두면 왼쪽 줄이 3V·IO3·CLK·IO0, 오른쪽 줄이 CS·IO1·IO2·G예요.</text>
<text x="40" y="962" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 데이터시트 이름과 대응: IO0 = DI(MOSI), IO1 = DO(MISO), IO2 = /WP, IO3 = /HOLD, 3V = VCC, G = GND.</text>
<text x="40" y="986" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 3V3은 3V로 바로 가요. IO3은 옆 구멍 3V에서, IO2는 보드 위로 IO3에서 점퍼해요. SPI로 쓸 때 IO2·IO3을 3.3V에 묶어요.</text>
<text x="40" y="1010" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· 소프트 터치 버튼은 양옆 탭 2개가 스위치 양쪽이고 방향은 상관없어요. 한쪽은 D1, 다른 쪽은 플래시 G 구멍에서 이어요.</text>
<text x="40" y="1034" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· D1은 펌웨어가 내부 풀업을 켜서, 버튼을 누르면 GND로 내려가 0이 돼요(active low).</text>
<text x="40" y="1058" font-size="13" text-anchor="start" font-weight="normal" fill="#333" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" >· BAT 패드는 밑면에 있어요. 밑면에서 보면 왼쪽 −, 오른쪽 +예요(그림은 위에서 비춘 모습이라 반대). 극성은 납땜 전에 멀티미터로 확인!</text>
</svg>
